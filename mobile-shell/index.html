<!doctype html>
<!--
  Offline / fallback page bundled inside the Android app (Capacitor webDir).
  The app normally loads the hosted EduConnect site; this page is shown only
  when that site can't be reached. Self-contained: no network requests.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#d93a3a" />
  <title>EduConnect AI</title>
  <style>
    :root {
      --brand: #d93a3a;
      --brand-dark: #b42d35;
      --pink: #fb87ab;
      --ink: #1b1f36;
      --ink-soft: #586189;
      --line: #e9ebf3;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: linear-gradient(180deg, #fff7fa 0%, #ffffff 60%);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    main { width: 100%; max-width: 380px; text-align: center; }
    .logo {
      display: inline-grid;
      place-items: center;
      width: 72px;
      height: 72px;
      border-radius: 22px;
      background: linear-gradient(135deg, #f25c5c 0%, #e8466b 55%, var(--pink) 100%);
      box-shadow: 0 10px 40px rgb(217 58 58 / 0.25);
    }
    .logo svg { width: 38px; height: 38px; }
    .brand { margin: 14px 0 0; font-weight: 800; letter-spacing: -0.01em; }
    .brand span { color: var(--brand); }
    h1 { margin: 28px 0 8px; font-size: 1.6rem; line-height: 1.2; font-weight: 800; letter-spacing: -0.02em; }
    p { margin: 0; color: var(--ink-soft); line-height: 1.55; }
    .actions { display: grid; gap: 10px; margin-top: 28px; }
    button {
      appearance: none;
      border: 0;
      height: 48px;
      border-radius: 14px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .primary { background: var(--brand); color: #fff; box-shadow: 0 1px 2px rgb(27 31 54 / 0.08); }
    .primary:active { background: var(--brand-dark); }
    .secondary { background: #fff; color: var(--ink); box-shadow: inset 0 0 0 1px #d0d4e4; }
    button:focus-visible { outline: 3px solid #f25c5c; outline-offset: 2px; }
    .hint { margin-top: 20px; font-size: 0.85rem; }
    .help {
      margin-top: 28px;
      padding: 14px 16px;
      border-radius: 16px;
      background: #fff;
      box-shadow: inset 0 0 0 1px var(--line);
      font-size: 0.85rem;
      color: var(--ink-soft);
    }
    .help a { color: var(--brand-dark); font-weight: 700; text-decoration: none; }
    .spin { display: none; }
    .busy .spin { display: inline-block; width: 16px; height: 16px; margin-right: 8px; vertical-align: -3px;
      border: 2px solid rgb(255 255 255 / 0.5); border-top-color: #fff; border-radius: 50%; animation: r 0.8s linear infinite; }
    @keyframes r { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="#fff">
        <path d="M11 4c.7 4.9 4.1 8.3 9 9-4.9.7-8.3 4.1-9 9-.7-4.9-4.1-8.3-9-9 4.9-.7 8.3-4.1 9-9z" />
        <path d="M19.5 2c.25 1.3 1.2 2.25 2.5 2.5-1.3.25-2.25 1.2-2.5 2.5-.25-1.3-1.2-2.25-2.5-2.5 1.3-.25 2.25-1.2 2.5-2.5z" />
      </svg>
    </div>
    <p class="brand">EduConnect <span>AI</span></p>

    <h1 id="title">Can't reach EduConnect</h1>
    <p id="message">We couldn't connect to the EduConnect server. Check your connection and try again.</p>

    <div class="actions">
      <button type="button" class="primary" id="retry"><span class="spin" aria-hidden="true"></span>Try again</button>
    </div>
    <p class="hint" id="status" role="status" aria-live="polite"></p>

    <div class="help">
      Need help now? Call <a href="tel:112">112</a> (emergency) or
      <a href="tel:116111">116 111</a> (Telefonul Copilului, free).
    </div>
  </main>

  <script>
    (function () {
      var title = document.getElementById("title");
      var message = document.getElementById("message");
      var status = document.getElementById("status");
      var retry = document.getElementById("retry");

      function render() {
        if (navigator.onLine === false) {
          title.textContent = "You're offline";
          message.textContent = "EduConnect needs an internet connection. Turn on Wi-Fi or mobile data, then try again.";
        } else {
          title.textContent = "Can't reach EduConnect";
          message.textContent = "We couldn't connect to the EduConnect server. Check your connection and try again.";
        }
      }

      function go() {
        retry.classList.add("busy");
        status.textContent = "Connecting…";
        // Set by MainActivity once this page has loaded. Never reload this page
        // itself: it is served from a local origin outside the app's allow-list.
        var target = window.EDUCONNECT_START_URL;
        if (target) {
          window.location.replace(target);
        } else {
          window.history.back();
        }
        setTimeout(function () {
          retry.classList.remove("busy");
          status.textContent = "";
        }, 8000);
      }

      retry.addEventListener("click", go);
      window.addEventListener("online", function () { render(); go(); });
      window.addEventListener("offline", render);
      render();
    })();
  </script>
</body>
</html>
